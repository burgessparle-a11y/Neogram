name: Build APK

on:
  workflow_dispatch: # 允许在手机网页上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 自动拉取子模块

      # 使用 JDK 17 驱动 Gradle 8.13
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 优化环境配置，加大服务器内存
      - name: Optimize Environment Properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.allWarningsAsErrors=false" >> gradle.properties
          echo "环境防爆补丁注入成功！"

      # 🛠️ 彻底修复路径后的图标自动补丁
      - name: Patch Missing Icons
        run: |
          mkdir -p app/src/main/res/mipmap
          
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_round.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/></vector>
          EOF
          echo "图标补丁路径修复，注入成功！"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 🚀 编译并开启错误追踪
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Watch-APK
          path: |
            **/build/outputs/apk/debug/*.apk
