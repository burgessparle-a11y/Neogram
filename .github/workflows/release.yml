name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Optimize Gradle
        run: |
          cat >> gradle.properties << EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx1536m
          kotlin.allWarningsAsErrors=false
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF

      - name: Patch Icons
        run: |
          mkdir -p app/src/main/res/mipmap
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_round.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Compile td Module
        run: ./gradlew :td:compileDebugKotlin --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace -x lint -x test

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neogram-Watch-APK
          path: "**/build/outputs/apk/debug/*.apk"
