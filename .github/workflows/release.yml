name: Build APK

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 修复缓存 400 错误的核心步骤（已升级 + 开启写入权限）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 优化 Gradle 配置
      - name: Optimize Environment Properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "kotlin.allWarningsAsErrors=false" >> gradle.properties
          echo "环境防爆补丁注入成功！"

      # 图标自动补丁
      - name: Patch Missing Icons
        run: |
          mkdir -p app/src/main/res/mipmap
          
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          
          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher_round.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#008577" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          echo "图标补丁路径修复，注入成功！"

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 编译 APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 上传 APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Watch-APK
          path: |
            **/build/outputs/apk/debug/*.apk
